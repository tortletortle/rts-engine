function drawPoints(){for(const p of a.points){const color=pointColor(p);g.save();g.strokeStyle=color;g.fillStyle=color;g.globalAlpha=.08;g.beginPath();g.arc(p.x,p.y,p.radius,0,Math.PI*2);g.fill();g.globalAlpha=.8;g.lineWidth=2;g.setLineDash(p.contested?[7,5]:[3,6]);g.stroke();g.setLineDash([]);g.fillStyle='#142521';g.beginPath();g.arc(p.x,p.y,13,0,Math.PI*2);g.fill();g.strokeStyle=color;g.stroke();g.textAlign='center';g.textBaseline='middle';g.font='bold 14px system-ui';g.fillStyle=color;g.fillText(p.id,p.x,p.y);g.fillStyle='#0b1816';g.fillRect(p.x-28,p.y+20,56,5);g.fillStyle=colors[p.progress<0?0:1];g.fillRect(p.x-28,p.y+20,56*Math.abs(p.progress),5);g.restore();}}
let lastTerritory='';function drawTerritory(){const snapshot=JSON.stringify([a.vp.map(Math.floor),a.points.map(p=>[p.owner,p.contested,Math.round(Math.abs(p.progress)*100),p.progress<0]),a.winner,Math.floor(a.income(0))]);if(snapshot===lastTerritory)return;lastTerritory=snapshot;
 $('territory').innerHTML=[0,1].map(s=>`<div class="score"><small>${s?'敌军':'友军'} · 胜利积分</small><div><b style="color:${colors[s]}">${Math.min(a.vpLimit,Math.floor(a.vp[s]))}</b> / ${a.vpLimit}</div><div class="score-track"><i style="width:${Math.min(100,100*a.vp[s]/a.vpLimit)}%;background:${colors[s]}"></i></div></div>`).join('')+`<div><small>友军收入 / 秒</small><div><b>+${a.income(0)}</b></div><span id="result">${a.winner===null?'':(a.winner==='draw'?'平局':a.winner===0?'胜利':'失败')+' · '+a.victoryReason}</span></div>`;
 const list=$('pointlist');for(const p of a.points){let row=list.querySelector(`[data-point="${p.id}"]`);if(!row){row=document.createElement('div');row.className='point-row';row.dataset.point=p.id;row.innerHTML='<b></b><button>调遣</button><small></small>';row.querySelector('button').onclick=()=>{if(a.selected.size){a.pending={ids:new Set(a.selected),x:p.x,y:p.y,formation:'block'};$('notice').textContent='已下令前往 '+p.id;}else $('notice').textContent='请先选择友军单位';};list.append(row);}row.querySelector('b').textContent=p.id+' · '+p.name;row.querySelector('b').style.color=pointColor(p);row.querySelector('small').textContent=(p.contested?'争夺中 · 停止收益':p.owner===null?'中立':p.owner===0?'友军控制':'敌军控制')+' · '+(p.progress===0?'未占领':(p.progress<0?'友军 ':'敌军 ')+Math.round(Math.abs(p.progress)*100)+'%');}}
function mini(){if(a.units.length>500&&miniFrame++%2!==0)return;const m=$('mini').getContext('2d');m.fillStyle='#132720';m.fillRect(0,0,240,160);m.fillStyle='#65766b';for(const o of a.obstacles)m.fillRect(o.x/5,o.y/5,o.w/5,o.h/5);for(const u of [...a.units,...a.buildings]){if(u.dead||u.hp<=0||u.side&&!visibleAt(u.x,u.y))continue;m.fillStyle=colors[u.side];m.fillRect(u.x/5,u.y/5,u.type?5:2,u.type?5:2)}for(const p of a.points){m.strokeStyle=pointColor(p);m.lineWidth=2;m.strokeRect(p.x/5-4,p.y/5-4,8,8)}}
$('formation').onchange=e=>formation=e.target.value;document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();run=!run}if(/^Digit[1-9]$/.test(e.code)){let k=e.code.slice(-1);if(e.ctrlKey){e.preventDefault();groups.set(k,new Set(a.selected))}else if(groups.has(k))a.selected=new Set(a.units.filter(u=>!u.dead&&groups.get(k).has(u.id)).map(u=>u.id))}if(e.key==='Escape')a.selected.clear();draw()});
